<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HistoQuiz - Histology MCQ Exam</title>
<style>
:root{--bg:#f0f4f8;--card:#fff;--text:#1a202c;--primary:#2563eb;--success:#16a34a;--danger:#dc2626;--muted:#64748b;--border:#e2e8f0;--shadow:0 4px 24px rgba(0,0,0,.08);--glow:0 0 30px rgba(37,99,235,.15)}
.dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--primary:#3b82f6;--border:#334155;--muted:#94a3b8;--shadow:0 4px 24px rgba(0,0,0,.4);--glow:0 0 30px rgba(59,130,246,.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:all .3s}
.container{max-width:760px;margin:0 auto;padding:12px}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:16px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.logo h1{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-btns{display:flex;gap:6px}
.btn-sm{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.75rem;transition:all .2s;font-weight:600}
.btn-sm:hover{border-color:var(--primary);background:rgba(37,99,235,.05)}
.btn-sm.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Welcome */
.welcome{background:var(--card);border-radius:20px;padding:40px 24px;box-shadow:var(--shadow);border:1px solid var(--border);text-align:center;position:relative;overflow:hidden}
.welcome::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(37,99,235,.03) 0%,transparent 70%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.welcome-icon{font-size:4rem;margin-bottom:20px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.welcome h2{font-size:1.6rem;margin-bottom:8px;font-weight:800}
.welcome .subtitle{color:var(--primary);font-weight:600;margin-bottom:16px;font-size:.95rem}
.welcome p{color:var(--muted);font-size:.85rem;margin-bottom:24px;line-height:1.7}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;text-align:left}
.feature{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(37,99,235,.04);border-radius:10px;font-size:.8rem;font-weight:500}
.feature-icon{font-size:1.1rem}
.start-btn{padding:16px 48px;border:none;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .3s;box-shadow:0 4px 15px rgba(37,99,235,.3);position:relative;z-index:1}
.start-btn:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(37,99,235,.4)}
.start-btn:active{transform:translateY(0)}

/* Quiz */
.progress-section{margin-bottom:12px}
.progress-info{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:500}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:3px;transition:width .5s ease}
.stats-row{display:flex;gap:8px;margin-bottom:12px}
.stat-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);transition:all .3s}
.stat-card .num{font-size:1.4rem;font-weight:800}
.stat-card .lbl{font-size:.65rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.score-num{color:var(--primary)}.correct-num{color:var(--success)}.wrong-num{color:var(--danger)}

.question-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px;animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.q-badge{display:inline-block;padding:4px 12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:20px;font-size:.7rem;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.q-title{font-size:1.1rem;font-weight:700;margin-bottom:16px}

/* Image Container - BIGGER */
.img-container{position:relative;width:100%;margin-bottom:16px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#f8fafc,#e2e8f0);box-shadow:inset 0 2px 10px rgba(0,0,0,.05)}
.dark .img-container{background:linear-gradient(135deg,#1e293b,#0f172a)}
.img-container img{width:100%;min-height:250px;max-height:500px;object-fit:contain;display:block;padding:8px;transition:all .3s}

/* BLUR OVERLAYS */
.blur-top{position:absolute;top:0;left:0;right:0;height:16%;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);background:rgba(0,0,0,.08);z-index:2;pointer-events:none;transition:all .6s ease}
.blur-mid{position:absolute;top:38%;left:5%;width:90%;height:18%;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);background:rgba(0,0,0,.05);z-index:2;pointer-events:none;border-radius:12px;transition:all .6s ease}
.blur-bot{position:absolute;bottom:0;left:0;right:0;height:16%;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);background:rgba(0,0,0,.08);z-index:2;pointer-events:none;transition:all .6s ease}
.blur-removed{backdrop-filter:blur(0)!important;-webkit-backdrop-filter:blur(0)!important;background:transparent!important}
.img-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;padding:4px 10px;border-radius:8px;font-size:.7rem;z-index:3;font-weight:600}

/* Options */
.options{display:grid;gap:8px}
.opt-btn{padding:14px 16px;border:2px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);font-size:.9rem;cursor:pointer;text-align:left;transition:all .25s;display:flex;align-items:center;gap:12px;font-weight:500;position:relative;overflow:hidden}
.opt-btn::before{content:'';position:absolute;top:0;left:0;width:0;height:100%;background:rgba(37,99,235,.05);transition:width .3s}
.opt-btn:hover:not(:disabled)::before{width:100%}
.opt-btn:hover:not(:disabled){border-color:var(--primary);transform:translateX(6px)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{border-color:var(--success);background:rgba(22,163,74,.08);animation:correctPulse .5s}
.opt-btn.wrong{border-color:var(--danger);background:rgba(220,38,38,.08);animation:wrongShake .5s}
@keyframes correctPulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.opt-letter{width:32px;height:32px;border-radius:10px;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0;transition:all .3s}
.correct .opt-letter{background:var(--success);color:#fff;transform:scale(1.1)}
.wrong .opt-letter{background:var(--danger);color:#fff}

/* Feedback */
.feedback{margin-top:16px;padding:16px;border-radius:14px;border:1px solid var(--border);animation:fadeIn .4s}
.feedback.correct-fb{background:rgba(22,163,74,.06);border-color:var(--success)}
.feedback.wrong-fb{background:rgba(220,38,38,.06);border-color:var(--danger)}
.feedback h4{margin-bottom:6px;font-size:1.05rem}
.feedback p{font-size:.82rem;color:var(--muted);line-height:1.6}
.feedback .answer-label{color:var(--text);font-weight:700;font-size:.9rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.next-btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:14px;transition:all .3s;box-shadow:0 4px 15px rgba(37,99,235,.2)}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(37,99,235,.3)}

/* Results */
.results-card{background:var(--card);border-radius:20px;padding:32px 24px;box-shadow:var(--shadow);border:1px solid var(--border);text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.results-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(37,99,235,.04) 0%,transparent 70%)}
.results-card h2{font-size:1.5rem;margin-bottom:20px;font-weight:800}
.big-score{font-size:4rem;font-weight:900;background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.r-stat{padding:16px;border-radius:14px;border:1px solid var(--border);background:rgba(37,99,235,.02)}
.r-stat .r-num{font-size:1.6rem;font-weight:800}
.r-stat .r-lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.pass{color:var(--success)}.fail{color:var(--danger)}
.btn-group{display:grid;gap:8px;margin-bottom:16px}
.share-wa{padding:14px;border:none;border-radius:14px;background:#25d366;color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s}
.share-wa:hover{background:#128c7e;transform:translateY(-2px)}

.review-section{margin-top:20px}
.review-section h3{font-size:1.1rem;margin-bottom:12px;font-weight:700}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);animation:fadeIn .3s}
.review-item.r-correct{border-left:4px solid var(--success)}
.review-item.r-wrong{border-left:4px solid var(--danger)}
.review-item img{width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin:8px 0}
.review-item .r-label{font-size:.82rem;margin:4px 0;line-height:1.5}
.restart-btn{width:100%;padding:14px;border:2px solid var(--primary);border-radius:14px;background:transparent;color:var(--primary);font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s}
.restart-btn:hover{background:var(--primary);color:#fff}
.hidden{display:none!important}

/* Confetti */
