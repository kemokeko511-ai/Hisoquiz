<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HistoQuiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;padding:16px}
.box{max-width:600px;margin:0 auto}
h1{text-align:center;font-size:1.5rem;margin-bottom:16px;color:#3b82f6}
.card{background:#1e293b;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #334155}
.score-row{display:flex;gap:8px;margin-bottom:12px;text-align:center}
.score-row div{flex:1;background:#1e293b;padding:10px;border-radius:10px;border:1px solid #334155}
.score-row .n{font-size:1.3rem;font-weight:bold}
.blue{color:#3b82f6}.green{color:#16a34a}.red{color:#dc2626}
.prog{height:6px;background:#334155;border-radius:3px;margin-bottom:16px;overflow:hidden}
.prog-fill{height:100%;background:#3b82f6;border-radius:3px;transition:width .4s}
.img-box{position:relative;border-radius:12px;overflow:hidden;margin-bottom:16px;background:#000}
.img-box img{width:100%;max-height:450px;object-fit:contain;display:block}
.blur-cover{position:absolute;top:0;left:0;right:0;height:17%;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(0,0,0,.1);z-index:2;transition:all .5s}
.blur-cover.off{backdrop-filter:none;-webkit-backdrop-filter:none;background:transparent}
.opts{display:grid;gap:8px}
.opt{padding:14px;border:2px solid #334155;border-radius:12px;background:#1e293b;color:#f1f5f9;font-size:.9rem;cursor:pointer;text-align:left;transition:all .2s}
.opt:hover{border-color:#3b82f6}
.opt.correct{border-color:#16a34a;background:rgba(22,163,74,.15)}
.opt.wrong{border-color:#dc2626;background:rgba(220,38,38,.15)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:14px;border-radius:12px;border:1px solid #334155}
.fb.ok{background:rgba(22,163,74,.1);border-color:#16a34a}
.fb.no{background:rgba(220,38,38,.1);border-color:#dc2626}
.fb h4{margin-bottom:4px}
.fb p{font-size:.82rem;color:#94a3b8;line-height:1.5}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#3b82f6;color:#fff;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:12px}
.btn:hover{background:#2563eb}
.btn2{width:100%;padding:14px;border:2px solid #3b82f6;border-radius:12px;background:transparent;color:#3b82f6;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:8px}
.hide{display:none}
.rev-item{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #334155}
.rev-item.rok{border-left:4px solid #16a34a}
.rev-item.rno{border-left:4px solid #dc2626}
.rev-item img{width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin:8px 0}
.rev-item p{font-size:.8rem;color:#94a3b8;margin:3px 0}
</style>
</head>
<body>
<div class="box">
<h1>🔬 HistoQuiz</h1>
<div id="home">
<div class="card" style="text-align:center">
<div style="font-size:3rem;margin-bottom:12px">🔬</div>
<h2 style="margin-bottom:8px">Histology Quiz</h2>
<p style="color:#94a3b8;margin-bottom:8px">Blood Film Identification</p>
<p style="color:#94a3b8;font-size:.85rem;margin-bottom:20px">5 MCQ Questions • Instant Feedback • Score + Review</p>
<button class="btn" onclick="start()">▶️ Start Quiz</button>
</div>
</div>
<div id="quiz" class="hide">
<div style="font-size:.82rem;color:#94a3b8;margin-bottom:4px">Question <span id="qn">1</span>/5</div>
<div class="prog"><div class="prog-fill" id="pf" style="width:0%"></div></div>
<div class="score-row">
<div><div class="n blue" id="sc">0</div><div style="font-size:.65rem;color:#94a3b8">Score</div></div>
<div><div class="n green" id="cr">0</div><div style="font-size:.65rem;color:#94a3b8">Correct</div></div>
<div><div class="n red" id="wr">0</div><div style="font-size:.65rem;color:#94a3b8">Wrong</div></div>
</div>
<div class="card">
<div style="font-size:.8rem;color:#94a3b8;margin-bottom:4px">Identify the tissue/cell:</div>
<div style="font-weight:bold;margin-bottom:12px">What is this tissue/cell?</div>
<div class="img-box">
<img id="qi" src="" alt="slide">
<div class="blur-cover" id="bl"></div>
</div>
<div class="opts" id="opts"></div>
<div id="fb" class="hide"></div>
<button class="btn hide" id="nb" onclick="next()">Next →</button>
</div>
</div>
<div id="res" class="hide">
<div class="card" style="text-align:center">
<h2>🎉 Quiz Complete!</h2>
<div style="font-size:3rem;font-weight:900;color:#3b82f6;margin:12px 0" id="fs">0%</div>
<div class="score-row">
<div><div class="n" id="rt">0</div><div style="font-size:.65rem;color:#94a3b8">Total</div></div>
<div><div class="n green" id="rc">0</div><div style="font-size:.65rem;color:#94a3b8">Correct</div></div>
<div><div class="n red" id="rw">0</div><div style="font-size:.65rem;color:#94a3b8">Wrong</div></div>
</div>
<div id="msg" style="font-size:1.2rem;font-weight:bold;margin-top:8px"></div>
</div>
<button class="btn" onclick="swa()">📱 Share WhatsApp</button>
<button class="btn2" onclick="re()">🔄 Try Again</button>
<h3 style="margin-top:20px;margin-bottom:12px">📝 Review</h3>
<div id="rv"></div>
</div>
</div>
<script>
var B='https://raw.githubusercontent.com/kemokeko511-ai/Hisoquiz/main/';
var D=[
{i:'Img1.jpg',l:'Blood film small lymphocyte',e:'Small round cell with dense dark nucleus occupying most of the cell, thin rim of basophilic cytoplasm. Smallest WBC.'},
{i:'Img2.jpg',l:'Blood film large lymphocyte',e:'Larger than small lymphocyte with more abundant pale blue cytoplasm. Round nucleus with less condensed chromatin.'},
{i:'Img3.jpg',l:'Blood film small & large lymphocytes',e:'Comparison: small has minimal cytoplasm with dense nucleus, large has more cytoplasm and open chromatin.'},
{i:'Img4.jpg',l:'Blood film monocyte',e:'Largest WBC. Kidney/horseshoe-shaped nucleus, abundant pale blue-grey cytoplasm with fine granules.'},
{i:'Img5.jpg',l:'Blood film leucocytes',e:'Mixed WBCs among RBCs. Neutrophils, eosinophils, lymphocytes, and monocytes visible.'}
];
var Q=[],C=0,S=0,CC=0,WC=0,A=[],AN=false;
function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){
var al=D.map(function(x){return x.l});
Q=[];
var sd=D.slice();
sh(sd);
for(var k=0;k<sd.length;k++){
var it=sd[k];
var co=it.l;
var wr=al.filter(function(x){return x!==co});
sh(wr);
wr=wr.slice(0,3);
var op=wr.concat([co]);
sh(op);
Q.push({src:B+it.i,l:co,e:it.e,o:op,ci:op.indexOf(co)});
}
C=0;S=0;CC=0;WC=0;A=[];
document.getElementById('home').className='hide';
document.getElementById('quiz').className='';
load();
}
function load(){
AN=false;
var q=Q[C];
document.getElementById('qn').textContent=C+1;
document.getElementById('pf').style.width=(C/Q.length*100)+'%';
document.getElementById('sc').textContent=S;
document.getElementById('cr').textContent=CC;
document.getElementById('wr').textContent=WC;
document.getElementById('qi').src=q.src;
document.getElementById('bl').classList.remove('off');
var od=document.getElementById('opts');
od.innerHTML='';
var lt=['A','B','C','D'];
for(var i=0;i<q.o.length;i++){
var b=document.createElement('button');
b.className='opt';
b.textContent=lt[i]+') '+q.o[i];
b.setAttribute('data-i',i);
b.onclick=function(){pick(parseInt(this.getAttribute('data-i')))};
od.appendChild(b);
}
document.getElementById('fb').className='hide';
document.getElementById('nb').className='btn hide';
}
function pick(idx){
if(AN)return;
AN=true;
var q=Q[C];
var ok=idx===q.ci;
if(ok){S++;CC++}else{WC++}
document.getElementById('bl').classList.add('off');
document.getElementById('sc').textContent=S;
document.getElementById('cr').textContent=CC;
document.getElementById('wr').textContent=WC;
var bs=document.querySelectorAll('.opt');
for(var i=0;i<bs.length;i++){
bs[i].disabled=true;
if(i===q.ci)bs[i].classList.add('correct');
if(i===idx&&!ok)bs[i].classList.add('wrong');
}
var f=document.getElementById('fb');
f.className='fb '+(ok?'ok':'no');
f.innerHTML='<h4>'+(ok?'✅ Correct!':'❌ Incorrect')+'</h4><p><b>'+q.l+'</b></p><p>'+q.e+'</p>';
A.push({l:q.l,s:q.o[idx],ok:ok,src:q.src,e:q.e});
var nb=document.getElementById('nb');
nb.className='btn';
nb.textContent=C+1>=Q.length?'📊 Results':'Next →';
}
function next(){
C++;
if(C>=Q.length){results()}else{load()}
}
function results(){
document.getElementById('quiz').className='hide';
document.getElementById('res').className='';
var t=Q.length;
var p=Math.round(CC/t*100);
document.getElementById('fs').textContent=p+'%';
document.getElementById('rt').textContent=t;
document.getElementById('rc').textContent=CC;
document.getElementById('rw').textContent=WC;
var m=document.getElementById('msg');
if(p>=80){m.textContent='🏆 Excellent!';m.style.color='#16a34a'}
else if(p>=60){m.textContent='👍 Good!';m.style.color='#3b82f6'}
else{m.textContent='💪 Try again!';m.style.color='#dc2626'}
var rv=document.getElementById('rv');
rv.innerHTML='';
for(var i=0;i<A.length;i++){
var a=A[i];
var d=document.createElement('div');
d.className='rev-item '+(a.ok?'rok':'rno');
d.innerHTML='<p><b>Q'+(i+1)+':</b> '+(a.ok?'✅':'❌')+' '+a.l+'</p><img src="'+a.src+'"><p>You: <b>'+a.s+'</b></p><p>Correct: <b style="color:#16a34a">'+a.l+'</b></p><p>'+a.e+'</p>';
rv.appendChild(d);
}
}
function swa(){
var t=Q.length;
var p=Math.round(CC/t*100);
var tx='🔬 HistoQuiz: '+CC+'/'+t+' ('+p+'%)'+'\nTry: https://kemokeko511-ai.github.io/Hisoquiz';
window.open('https://wa.me/?text='+encodeURIComponent(tx));
}
function re(){
document.getElementById('res').className='hide';
document.getElementById('home').className='';
}
</script>
</body>
</html>
